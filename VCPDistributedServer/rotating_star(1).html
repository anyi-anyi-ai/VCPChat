<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Star - Three.js (Blue & Fast)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00d4ff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="info">Aemeath's Star Engine • Overclocked Blue Core</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        // 主光源也稍微偏蓝，契合内核
        const pointLight1 = new THREE.PointLight(0x0088ff, 2, 50);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x00d4ff, 1.5, 50);
        pointLight2.position.set(-10, -10, 10);
        scene.add(pointLight2);

        // 星体线框
        const geometry = new THREE.IcosahedronGeometry(4, 1);
        const material = new THREE.MeshPhongMaterial({
            color: 0xffffff,
            emissive: 0x001133, // 幽蓝色自发光
            specular: 0xffffff,
            shininess: 100,
            wireframe: true,
            transparent: true,
            opacity: 0.8
        });
        const star = new THREE.Mesh(geometry, material);
        scene.add(star);

        // 内核 (变成蓝色了！)
        const coreGeometry = new THREE.IcosahedronGeometry(3.5, 2);
        const coreMaterial = new THREE.MeshPhongMaterial({
            color: 0x0088ff, // 核心蓝色
            emissive: 0x002244,
            flatShading: true
        });
        const core = new THREE.Mesh(coreGeometry, coreMaterial);
        star.add(core);

        // 星环
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1000;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i += 3) {
            const radius = 6 + Math.random() * 4;
            const theta = Math.random() * Math.PI * 2;
            const yOffset = (Math.random() - 0.5) * 2;
            posArray[i] = Math.cos(theta) * radius;
            posArray[i + 1] = yOffset;
            posArray[i + 2] = Math.sin(theta) * radius;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0x00d4ff,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const particleMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        particleMesh.rotation.x = Math.PI / 4;
        scene.add(particleMesh);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // 速度加快 (Overclocked!)
            star.rotation.x += 0.015; // 原为 0.005
            star.rotation.y += 0.03;  // 原为 0.01
            core.rotation.y -= 0.01;  // 原为 0.002

            particleMesh.rotation.z += 0.008; // 原为 0.002
            particleMesh.position.y = Math.sin(elapsedTime * 1.5) * 0.5; // 浮动加快

            camera.position.x = Math.sin(elapsedTime * 0.5) * 2; // 漂移加快
            camera.position.y = Math.cos(elapsedTime * 0.5) * 2;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
